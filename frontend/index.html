<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local AI Workspace — Shell-Mind</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="titlebar">
    <span id="clock">--:--</span>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="body-row">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">⚡ Local AI Workspace</div>
      <button class="new-chat-btn" id="newChatBtn">+ New chat</button>

      <div class="divider"></div>
      <div class="section-label">CHAT THREADS</div>
      <div class="threads" id="threadList"></div>

      <div class="divider"></div>
      <div class="section-label">DOCUMENT RAG</div>
      <div class="upload-btn" id="uploadBtn">↑ Upload PDF</div>
      <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">
      <div class="hint">200MB per file</div>
      
      <div class="divider"></div>
      <div class="section-label">COMPUTE MODE</div>
      <select id="modeSelect" class="mode-dropdown">
        <option value="cpu">CPU Lite (0.5B - Fast)</option>
        <option value="gpu" selected>GPU Copilot (7B - Standard)</option>
        <option value="agent">Agent Workstation (Multi-Model)</option>
      </select>
    </div>

    <!-- Main chat -->
    <div class="main">
      <div class="backend-bar" id="backendBar">Backend: Initializing...</div>
      <div class="chat-container">
        <div class="messages" id="messages">
          <div class="empty-state" id="emptyState">
            <div class="empty-title">New chat</div>
            <div class="empty-sub">Everything below runs entirely on this laptop — nothing leaves the device.</div>
            <div class="chips">
              <div class="chip" data-text="Summarize a PDF">Summarize a PDF</div>
              <div class="chip" data-text="Explain a concept">Explain a concept</div>
              <div class="chip" data-text="Write & debug code">Write & debug code</div>
              <div class="chip" data-text="Draft an email">Draft an email</div>
            </div>
          </div>
        </div>

        <div id="imageIndicator" style="display:none; color:#C99B3D; font-size:11px; padding: 0 24px 5px 24px;">
          📎 Attached: <span id="imageName"></span>
        </div>
        
        <div class="input-row">
          <div class="input-box">
            <button class="attach-btn" id="attachBtn" title="Attach Image">📎</button>
            <input type="file" id="visionInput" accept="image/png, image/jpeg" style="display:none;">
            
            <input type="text" id="promptInput" placeholder="Ask your local model anything...">
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
