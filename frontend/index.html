<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local AI Workspace — Shell-Mind</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="titlebar">
    <span id="clock">--:--</span>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="body-row">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">⚡ Local AI Workspace</div>
      <button class="new-chat-btn" id="newChatBtn">➕ New Chat</button>

      <div class="divider"></div>
      <div class="section-label">💬 CHAT THREADS</div>
      <div class="threads" id="threadList"></div>
      
      <div class="divider"></div>
      <div class="section-label">📁 DOCUMENT RAG (200MB LIMIT)</div>
      <div class="upload-zone" id="uploadZone" title="Click to upload PDFs">
        <div class="upload-icon">📄</div>
        <div class="upload-text">Upload PDF Context</div>
        <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">
      </div>

      <div class="divider"></div>
      <div class="section-label">⚙️ COMPUTE MODE</div>
      <select id="modeSelect" class="mode-dropdown">
        <option value="cpu">CPU Lite (0.5B - Fast)</option>
        <option value="gpu" selected>GPU Copilot (7B - Standard)</option>
        <option value="agent">Agent Workstation (Multi-Model)</option>
      </select>
      
      <button class="clear-all-btn" id="clearAllBtn">🔥 Clear All Data</button>
    </div>

    <!-- Main chat -->
    <div class="main">
      <div class="backend-bar" id="backendBar">Backend: Initializing...</div>
      <div class="chat-container">
        
        <div class="messages" id="messages">
          <div class="empty-state" id="emptyState">
            <div class="empty-title">New Chat</div>
            <div class="empty-sub">Backend: RTX 5050 4-Bit | 100% Local Processing</div>
            <div class="chips">
              <div class="chip" data-text="Analyze a C++ pointer error">Analyze C++ bug</div>
              <div class="chip" data-text="Explain the multi-agent architecture">Explain Architecture</div>
              <div class="chip" data-text="Write a bash script to clear cache">Write Bash Script</div>
            </div>
          </div>
        </div>

        <div id="imageIndicator" class="attachment-indicator" style="display:none;">
          📎 Attached Image: <span id="imageName"></span>
        </div>
        <div id="pdfIndicator" class="attachment-indicator" style="display:none; color: #4A90E2;">
          📄 Attached PDF: <span id="pdfName"></span>
        </div>
        
        <div class="input-row">
          <div class="input-box">
            <button class="attach-btn" id="attachBtn" title="Attach Image">📎</button>
            <input type="file" id="visionInput" accept="image/png, image/jpeg" style="display:none;">
            
            <input type="text" id="promptInput" placeholder="Ask your local model anything...">
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
